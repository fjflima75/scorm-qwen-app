<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lessonsmith — turn your knowledge into LMS-ready SCORM courses with AI." />
    <title>Lessonsmith — AI SCORM Course Studio</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23175943'/%3E%3Cpath d='M9 21V11h4.2c2.6 0 4.2 1.3 4.2 3.4S15.8 17.8 13.2 17.8H11.4V21H9zm8.6 0 3.4-5.4 2.8 5.4h2.6l-4.1-7.4L26 11h-2.7l-5.7 6.8V11H15v10h2.6z' fill='%23F3F4F0'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* If the app bundle never mounts, surface a visible reason instead of a blank screen. */
      window.addEventListener("error", function (e) {
        var root = document.getElementById("root");
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f3f4f0;font-family:system-ui,sans-serif;padding:24px">' +
            '<div style="background:#fff;border:1px solid #d3d8cf;border-radius:14px;padding:28px 32px;max-width:520px">' +
            '<p style="margin:0;font-weight:800;font-size:17px;color:#14201a">Lessonsmith could not start</p>' +
            '<p style="margin:8px 0 0;font-size:13.5px;line-height:1.55;color:#39423c">The app script failed to load or threw before mounting. Try a hard reload (Ctrl/Cmd+Shift+R).</p>' +
            '<pre style="margin:14px 0 0;padding:12px;background:#f3f4f0;border-radius:8px;font-size:11px;color:#67716a;overflow:auto;max-height:120px"></pre>' +
            "</div></div>";
          var pre = root.querySelector("pre");
          if (pre) pre.textContent = String((e && e.message) || e);
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
